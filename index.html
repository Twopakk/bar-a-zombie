<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0d1b21"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>Le Bar à Zombie</title>

<style>
/* Mise en page : une colonne centrée, grosses tuiles à presser, barre de niveau dans l’en-tête, les écrans s’échangent sur place. */
:root{
  --bg:#eef4f2; --surface:#ffffff; --surface2:#e0ebe8; --fg:#12262d; --muted:#4f6b75; --line:#c5d6d2;
  --accent:#ffb000; --accent-fg:#1a1200; --accent-deep:#b37b00; --accent-soft:#fff1c9;
  --good:#14865a; --good-bg:#d6f2e5; --bad:#cf3b3b; --bad-bg:#fbdcdc;
  --font-display:'Bagel Fat One', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  --font-body:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1b21; --surface:#152a32; --surface2:#1d3842; --fg:#e8f2f0; --muted:#93adb4; --line:#284550;
    --accent-soft:#3a3010; --good:#3ddc97; --good-bg:#123a2b; --bad:#ff7070; --bad-bg:#3f1d22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1b21; --surface:#152a32; --surface2:#1d3842; --fg:#e8f2f0; --muted:#93adb4; --line:#284550;
  --accent-soft:#3a3010; --good:#3ddc97; --good-bg:#123a2b; --bad:#ff7070; --bad-bg:#3f1d22;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font-body);padding-inline:16px}
.wrap{max-width:640px;margin-inline:auto;padding-block:16px 48px}
h2,h3,p{margin:0}
button{font:inherit}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding-bottom:16px}
.brand{font-family:var(--font-display);font-size:1.6rem;line-height:1}
.xp{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.xp i{display:block;width:84px;height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.xp b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

.btn{font-weight:700;border:0;border-radius:14px;padding:12px 18px;background:var(--accent);color:var(--accent-fg);box-shadow:0 4px 0 var(--accent-deep);cursor:pointer;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wide{width:100%}

.deck{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px}
.deck-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.deck h2,.gtop h2{font-family:var(--font-display);font-weight:400;font-size:1.4rem;line-height:1.1}
.sub,.note{color:var(--muted);font-size:.9rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted);margin-bottom:8px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface2);border-radius:99px;padding:4px 12px;font-size:.85rem;font-weight:500}

.how{margin-bottom:14px}
.steps{margin:0;padding-left:1.3rem;display:grid;gap:10px}
.steps li{padding-left:2px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;display:grid;gap:10px}
.box p{font-size:.92rem}
.box .steps{font-size:.92rem}
.learn{background:var(--surface2);border-radius:14px;padding:12px 14px}
.learn .label{margin-bottom:4px}
.learn p{font-size:.92rem}
.section-label{margin:20px 0 10px}

.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.game{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--line);cursor:pointer;min-height:88px}
.game:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.game:disabled{opacity:.5;cursor:not-allowed}
.gi{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--font-display);font-size:1.25rem;background:var(--gc);color:var(--gf)}
.game h3{font-family:var(--font-display);font-weight:400;font-size:1.15rem}
.game p{color:var(--muted);font-size:.9rem;margin-top:2px}
.games+.note{margin-top:14px}
.foot{margin-top:24px;text-align:center}

.gtop{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.gtop p{color:var(--muted);font-size:.85rem}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums;min-height:28px}
.stats b{color:var(--fg)}
.combo.hot{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:2px 10px;font-weight:700}
.hearts{display:flex;gap:3px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{min-height:76px;padding:10px;border-radius:18px;background:var(--surface);color:var(--fg);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);cursor:pointer;font-weight:500;overflow-wrap:anywhere;display:grid;place-items:center;text-align:center;transition:transform .12s}
.tile.q{font-family:var(--font-display);font-weight:400;font-size:1.05rem}
.tile.sel{background:var(--accent-soft);border-color:var(--accent);transform:translateY(-3px)}
.tile.ok{background:var(--tbg);color:var(--tfg);border-color:transparent;animation:pop .45s forwards}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(.2);opacity:0}}

.prompt{font-family:var(--font-display);font-size:1.7rem;line-height:1.2;text-wrap:balance;margin:18px 0;text-align:center;overflow-wrap:anywhere}
.opts{display:grid;gap:12px;margin-bottom:16px}
.opt{font-weight:500;text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:0 4px 0 var(--line);cursor:pointer;min-height:56px;overflow-wrap:anywhere}

.flipcard{width:100%;min-height:240px;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);padding:24px;display:grid;align-content:center;justify-items:center;gap:12px;text-align:center;cursor:pointer;margin-bottom:18px;animation:flipin .3s}

.flipcard .big{font-family:var(--font-display);font-size:1.8rem;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.flipcard .tapnote{color:var(--muted);font-size:.9rem}
@keyframes flipin{from{transform:rotateX(60deg);opacity:.3}to{transform:none;opacity:1}}
.ing{list-style:none;padding:0;margin:0;display:grid;gap:6px;width:100%;max-width:340px}
.ing li{background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:500;font-size:1.05rem}

input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.typein{font-size:1.1rem;padding:14px;margin-bottom:12px;border-radius:14px;border-width:2px}
.fb{padding:14px 16px;border-radius:16px;margin:4px 0 14px;border:2px solid;display:grid;gap:10px}
.fb.good{background:var(--good-bg);border-color:var(--good)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.result{text-align:center;display:grid;gap:14px;justify-items:center;padding-block:12px}

.stars{display:flex;gap:8px}

.result .two{width:100%;margin-top:6px}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;align-items:start}
.fields{display:grid;gap:10px;min-width:0}
.fld{display:grid;gap:4px;min-width:0}
.flabel{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.edit-actions{display:grid;gap:12px;margin-block:16px}
.extra{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:16px}
summary{font-weight:700;cursor:pointer}

details .steps{margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:18px 8px}

.goal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:10px;margin-bottom:10px}
.goalname{font-family:var(--font-display);font-size:1.4rem;line-height:1.15;margin-bottom:8px;overflow-wrap:anywhere}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-width:56px;min-height:38px;border:2px dashed var(--line);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:4px 10px;font-weight:700;color:var(--muted);font-size:.9rem}
.slot.done{border-style:solid;border-color:var(--good);background:var(--good-bg);color:var(--fg)}
.slot svg{width:18px;height:18px;flex:none}
.peek{background:var(--surface2);border-radius:12px;padding:10px}
.peek .ing li{background:var(--surface)}
.msg{min-height:24px;font-size:.9rem;font-weight:500;margin-bottom:6px}
.msg.good{color:var(--good)}
.msg.bad{color:var(--bad)}
.boardwrap{background:var(--surface2);border-radius:22px;padding:6px;margin:0 auto 14px;max-width:460px}
.board{position:relative;aspect-ratio:1;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.board.shake{animation:shake .4s}
.candy{position:absolute;left:0;top:0;display:block;width:calc(100% / 7);height:calc(100% / 7);padding:0;border:0;background:none;cursor:pointer;transform:translate(calc(var(--c) * 100%),calc(var(--r) * 100%));transition:transform .24s cubic-bezier(.3,.7,.4,1)}
.candy svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);transition:transform .15s;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2));pointer-events:none}
.candy.sel::before{content:'';position:absolute;inset:2px;border-radius:14px;background:var(--accent-soft);outline:2px solid var(--accent)}
.candy.sel svg{transform:scale(1.12)}
.candy.pop svg{animation:crushpop .28s forwards}
@keyframes crushpop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.lg{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 8px;font-size:.88rem;font-weight:500}
.lg svg{width:20px;height:20px;flex:none}

.scenebox{position:relative;max-width:460px;margin:0 auto 12px}
.scene{position:relative;aspect-ratio:360/236;margin:0;border-radius:20px;overflow:hidden;background:#0f2a33;border:1px solid var(--line)}
.scene .layer{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .layer.back{z-index:1}
.scene .layer.front{z-index:3;pointer-events:none}
.seats{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding-inline:6px}
.tixl{z-index:4;pointer-events:none;align-items:end}
.seat{position:relative;display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;min-width:0}
.seat.empty{cursor:default;pointer-events:none}
.bust{position:absolute;left:0;right:0;bottom:36%;height:50%;display:flex;justify-content:center;align-items:flex-end;transition:transform .15s}
.bustsvg{height:100%;width:auto;display:block;overflow:visible}
.seat:active .bust{transform:translateY(2px)}
.seat.ready .bust{filter:drop-shadow(0 0 7px #ffb000)}
.bustsvg .m,.bustsvg .brow,.bustsvg .hearts{display:none}
.seat[data-mood="ok"] .m-ok,.seat[data-mood="meh"] .m-meh,.seat[data-mood="bad"] .m-bad,.seat[data-mood="bad"] .brow,.seat[data-state="served"] .hearts{display:inline}
.seat[data-state="served"] .hearts{animation:floaty .85s ease-out both}
@keyframes floaty{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-6px);opacity:1}}
.tix{margin:0 5px 14px;padding:5px 6px 6px;background:#fff6dc;color:#2a2112;border-radius:6px;display:grid;gap:2px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.4);transform:rotate(-1.2deg);min-width:0}

.tix.empty{visibility:hidden}
.tn{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.65}
.td{font-family:var(--font-display);font-size:.88rem;line-height:1.05;overflow-wrap:anywhere}
.tc{font-size:.62rem;line-height:1.15;opacity:.75}
.pat{display:block;width:100%;height:7px;border-radius:99px;overflow:hidden;margin-top:3px;background:rgba(0,0,0,.18)}
.pat b{display:block;height:100%;background:#2f9e44;transition:width .1s linear}
.pat.low b{background:#cf3b3b}
.rfb{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;z-index:6;pointer-events:none}
.rfb .fb{animation:fbin .18s ease-out;margin:0;padding:8px 12px;gap:4px;font-size:.88rem;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.rfb .ing{display:flex;flex-wrap:wrap;gap:6px;max-width:none}
.rfb .ing li{padding:2px 9px;font-size:.82rem}
.bubs{z-index:5;pointer-events:none;align-items:start}
.bubcell{position:relative;min-width:0}

.bub::after{content:'';position:absolute;left:var(--tail,50%);top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0}

.bub.perso.c0{left:0}.bub.perso.c2{right:0}.bub.perso.c1{left:-36%;transform:none}
@keyframes fbin{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
@keyframes bubout{to{opacity:0;scale:.85}}
.bub.bye{animation:bubout .18s ease-in forwards}
@keyframes bubin{from{opacity:0;scale:.6}to{opacity:1;scale:1}}

.bench{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.glasswrap{width:110px;flex:none}

.benchr{flex:1;min-width:0;display:grid;gap:8px;align-content:start}
.glass-top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.gchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gchip{border:0;border-radius:99px;padding:8px 14px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:.9rem;cursor:pointer}
.gempty{color:var(--muted);font-size:.9rem}
.pour{transform-box:fill-box;transform-origin:50% 100%;animation:pour .35s ease-out}
@keyframes pour{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.xrow{margin-bottom:12px}

.diffs{display:grid;gap:8px;margin:4px 0 14px}

  *{animation:none!important;transition:none!important}
}
</style>

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,' et ').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function weakFirst(cards){
  return cards.map(function(c){return {c:c,k:c.m+Math.random()*1.5}}).sort(function(a,b){return a.k-b.k}).map(function(x){return x.c});
}
function lev(a,b){
  var m=a.length,n=b.length,p=[],i,j;
  for(j=0;j<=n;j++)p[j]=j;
  for(i=1;i<=m;i++){
    var prev=p[0];p[0]=i;
    for(j=1;j<=n;j++){
      var tmp=p[j];
      p[j]=Math.min(p[j]+1,p[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));
      prev=tmp;
    }
  }
  return p[n];
}
function fuzzy(a,b){
  if(a===b)return true;
  var t=Math.floor(Math.max(a.length,b.length)/6);
  return t>0&&lev(a,b)<=t;
}
function items(s){return String(s).split(/[,;·\/\n]+/).map(norm).filter(Boolean)}
function judge(user,ans){
  var A=items(ans),U=items(user),rem=A.slice(),hit=0;
  U.forEach(function(u){
    var k=-1;for(var i=0;i<rem.length;i++){if(fuzzy(u,rem[i])){k=i;break}}
    if(k>-1){rem.splice(k,1);hit++}
  });
  var extra=U.length-hit;
  return {ok:rem.length===0&&extra===0&&U.length>0,missing:rem,extra:extra};
}

function groupsOfMatrix(m){
  var hit={},r,c,k,t,j,i;
  for(r=0;r<NB;r++){
    c=0;
    while(c<NB){
      t=m[r][c];k=c;
      while(k+1<NB&&m[r][k+1]===t)k++;
      if(k-c>=2)for(j=c;j<=k;j++)hit[r*NB+j]=1;
      c=k+1;
    }
  }
  for(c=0;c<NB;c++){
    r=0;
    while(r<NB){
      t=m[r][c];k=r;
      while(k+1<NB&&m[k+1][c]===t)k++;
      if(k-r>=2)for(i=r;i<=k;i++)hit[i*NB+c]=1;
      r=k+1;
    }
  }
  var seen={},groups=[];
  Object.keys(hit).forEach(function(key){
    if(seen[key])return;
    var s=[+key],cells=[],ty=m[Math.floor(key/NB)][key%NB];
    seen[key]=1;
    while(s.length){
      var q=s.pop(),qr=Math.floor(q/NB),qc=q%NB;
      cells.push(q);
      [[qr-1,qc],[qr+1,qc],[qr,qc-1],[qr,qc+1]].forEach(function(p){
        if(p[0]<0||p[1]<0||p[0]>=NB||p[1]>=NB)return;
        var n=p[0]*NB+p[1];
        if(hit[n]&&!seen[n]&&m[p[0]][p[1]]===ty){seen[n]=1;s.push(n)}
      });
    }
    groups.push({t:ty,cells:cells});
  });
  return groups;
}
function hasMoveM(m){
  for(var r=0;r<NB;r++)for(var c=0;c<NB;c++){
    var o=[[0,1],[1,0]];
    for(var k=0;k<2;k++){
      var r2=r+o[k][0],c2=c+o[k][1];
      if(r2>=NB||c2>=NB)continue;
      var a=m[r][c];m[r][c]=m[r2][c2];m[r2][c2]=a;
      var ok=groupsOfMatrix(m).length>0;
      a=m[r][c];m[r][c]=m[r2][c2];m[r2][c2]=a;
      if(ok)return true;
    }
  }
  return false;
}
function hasUsefulM(m){
  for(var r=0;r<NB;r++)for(var c=0;c<NB;c++){
    var o=[[0,1],[1,0]];
    for(var k=0;k<2;k++){
      var r2=r+o[k][0],c2=c+o[k][1];
      if(r2>=NB||c2>=NB)continue;
      var a=m[r][c];m[r][c]=m[r2][c2];m[r2][c2]=a;
      var gs=groupsOfMatrix(m),ok=gs.some(function(g){var o2=L.opts[g.t];return o2.ok&&L.got[g.t]<L.need[g.t]});
      a=m[r][c];m[r][c]=m[r2][c2];m[r2][c2]=a;
      if(ok)return true;
    }
  }
  return false;
}

function randType(){
  var w=L.opts.map(function(o,i){return o.ok&&L.got[i]<L.need[i]?1.6:1}),sum=w.reduce(function(a,b){return a+b},0),x=Math.random()*sum;
  for(var i=0;i<w.length;i++){x-=w[i];if(x<0)return i}

}

function swapTiles(a,b){
  var ar=a.r,ac=a.c,br=b.r,bc=b.c;

async function trySwap(a,b){

    var good=[];
    groups.forEach(function(g){
      var o=L.opts[g.t];
      L.score+=g.cells.length*10*chain;
      if(o.ok){if(L.got[g.t]<L.need[g.t]){L.got[g.t]++;good.push(o.text)}}
      else if(chain===1&&!spilled)spilled=o.text;
      g.cells.forEach(function(k){B.grid[Math.floor(k/NB)][k%NB].el.classList.add('pop')});
    });
    if(good.length)say('Bien : '+good.join(', ')+'.','good');
    updateHUD();
    await wait(290);if(tok!==B.token)return;
    groups.forEach(function(g){g.cells.forEach(function(k){
      var r=Math.floor(k/NB),c=k%NB,t=B.grid[r][c];
      if(t){t.el.remove();B.grid[r][c]=null}
    })});
    var fresh=[];
    for(var c=0;c<NB;c++){
      var col=[],r;
      for(r=NB-1;r>=0;r--)if(B.grid[r][c])col.push(B.grid[r][c]);
      var miss=NB-col.length;
      for(r=0;r<NB;r++)B.grid[r][c]=null;
      for(var i=0;i<col.length;i++){var rr=NB-1-i;B.grid[rr][c]=col[i];setPos(col[i],rr,c)}
      for(r=0;r<miss;r++){
        var nt=makeTile(randType(),r-miss,c);
        B.grid[r][c]=nt;fresh.push([nt,r,c]);
      }
    }
    void board.offsetWidth;
    fresh.forEach(function(f){setPos(f[0],f[1],f[2])});
    await wait(320);if(tok!==B.token)return;
  }
  if(spilled){
    L.hearts--;
    say('Raté : « '+spilled+' » n’est pas dans « '+L.card.q+' ».','bad');
    board.classList.remove('shake');void board.offsetWidth;board.classList.add('shake');
  }
  updateHUD();
}

  G.levelStars[li]=Math.max(G.levelStars[li]||0,stars);

    var mood=cu.served?'ok':moodOf(cu);cu.mood=mood;
    b+='<button class="seat'+(hasPrep()?' ready':'')+'" data-act="seat" data-i="'+i+'" data-mood="'+mood+'" data-state="'+(cu.served?'served':'wait')+'" aria-label="Servir '+esc(cu.name)+' : '+esc(cu.card.q)+'"><span class="bust">'+custSVG(cu)+'</span></button>';
    t+='<div class="tix"><span class="tn">'+esc(cu.name)+'</span><span class="td">'+esc(cu.card.q)+'</span><span class="tc">'+esc(cu.need)+'</span><span class="pat" data-p="'+i+'"><b style="width:'+(cu.pat/cu.max*100)+'%"></b></span></div>';
  });
  var eb=document.getElementById('seatBtns'),et=document.getElementById('seatTix');
  if(eb)eb.innerHTML=b;
  if(et)et.innerHTML=t;
  renderBubbles();
}
function updGlass(anim){
  var gv=document.getElementById('glassv');
  if(gv)gv.innerHTML=glassHTML(anim);
  var g=document.getElementById('gchips');
  if(g)g.innerHTML=R.glass.length?R.glass.map(function(i){return '<button class="gchip" data-act="unadd" data-i="'+i+'" aria-label="Retirer '+esc(R.shelf[i])+'">'+esc(R.shelf[i])+' ×</button>'}).join(''):'<span class="gempty">Touche les ingrédients de l’étagère</span>';
  var bs=document.querySelectorAll('.bottle'),k;
  for(k=0;k<bs.length;k++)bs[k].classList.toggle('in',R.glass.indexOf(k)>=0);
  var ss=document.querySelectorAll('#seatBtns .seat:not(.empty)');
  for(k=0;k<ss.length;k++)ss[k].classList.toggle('ready',hasPrep());
}
function updX(){
  var xs=document.querySelectorAll('.xopt');
  for(var k=0;k<xs.length;k++){var f=xs[k].dataset.f;xs[k].classList.toggle('sel',R.pick[f]===R.xopts[f][+xs[k].dataset.i])}
  var ss=document.querySelectorAll('#seatBtns .seat:not(.empty)');
  for(k=0;k<ss.length;k++)ss[k].classList.toggle('ready',hasPrep());
}
function pickRushCard(){
  var busy={};R.seats.forEach(function(s){if(s)busy[s.card.id]=1});
  var c=R.menu.filter(function(x){return !busy[x.id]});
  if(!c.length)c=R.menu;
  var w=c.map(function(x){return 1+(3-x.m)+Math.random()}),sum=w.reduce(function(a,b){return a+b},0),r=Math.random()*sum;
  for(var i=0;i<c.length;i++){r-=w[i];if(r<0)return c[i]}
  return c[c.length-1];
}
function extrasOf(card){
  return XF.filter(function(x){return R.fields.indexOf(x[0])>=0&&card[x[0]]&&String(card[x[0]]).trim()});
}
function spawnCustomer(i){
  var card=pickRushCard(),n=splitItems(card.a).length,ex=extrasOf(card);
  var D=diffOf(),pat=Math.max(D.floor,(14000+4000*Math.min(n,5)+2500*ex.length)*D.m*(1-R.el/220000));
  var used={};R.seats.forEach(function(s){if(s)used[s.name]=1});
  var names=NAMES.filter(function(x){return !used[x]});
  var rnd=function(a){return a[Math.floor(Math.random()*a.length)]};
  var need=(n>1?n+' ingr.':'1 réponse')+(ex.length?' · '+ex.map(function(x){return x[2]}).join(' · '):'');
  R.seats[i]={card:card,name:rnd(names),need:need,ex:ex.length,pat:pat,max:pat,penal:false,served:false,mood:'ok',n:n,
    look:{skin:Math.random()<.25?SKIN[4]:rnd(SKIN.slice(0,4)),hair:rnd(HAIR),hs:Math.floor(Math.random()*3),shirt:rnd(SHIRT)}};
}
function initRush(){
  var tok=B.token;
  R.last=Date.now();
  var xs=document.getElementById('xsel');if(xs)xs.innerHTML=xselHTML();
  renderSeats();updGlass();updX();updRush();
  R.iv=setInterval(function(){rushTick(tok)},100);
}
function rushTick(tok){
  if(tok!==B.token||R.over){clearInterval(R.iv);return}
  var now=Date.now(),dt=Math.min(250,now-R.last),changed=false;
  R.last=now;R.el+=dt;R.t=Math.max(0,SHIFT-R.el);
  R.seats.forEach(function(cu,i){
    if(cu){
      if(cu.served)return;
      cu.pat-=dt;
      if(cu.pat<=0){
        R.missed++;R.streak=0;R.errCards[cu.card.id]=cu.card;
        if(!cu.penal)bump(cu.card.id,-1);
        rushFb('<div class="fb bad"><b>'+esc(cu.name)+' est parti.</b><span>'+esc(cu.card.q)+' demande :</span>'+recipeHTML(cu.card)+'</div>',4200);
        R.seats[i]=null;R.nextAt[i]=R.el+1500;changed=true;
      }else{
        var pe=document.querySelector('.pat[data-p="'+i+'"]');
        if(pe){pe.firstChild.style.width=(cu.pat/cu.max*100)+'%';pe.classList.toggle('low',cu.pat/cu.max<.35)}
        var mo=moodOf(cu);
        if(mo!==cu.mood){cu.mood=mo;if(mo==='meh'||mo==='bad')bubble(i,pickTxt(CHAT[mo]),'chat',3000,false);var sb=document.querySelector('#seatBtns .seat[data-i="'+i+'"]');if(sb)sb.setAttribute('data-mood',mo)}
      }
    }else if(R.el>=R.nextAt[i]){spawnCustomer(i);R.seats[i].say={txt:pickTxt(CHAT.order).replace('{q}',R.seats[i].card.q),kind:'order',until:R.el+5500};changed=true}
  });
  persoTick();
  var rb=false;R.seats.forEach(function(cu){if(cu&&cu.say&&R.el>=cu.say.until){cu.say=null;rb=true}});
  if(changed)renderSeats();else if(rb)renderBubbles();
  updRush();
  if(R.t<=0)endRush();
}
function checkOrder(cu){
  var c=cu.card,bad=[];
  var want=splitItems(c.a).map(norm).sort().join('|');
  var have=R.glass.map(function(k){return norm(R.shelf[k])}).sort().join('|');
  var picks=R.fields.map(function(f){return norm(R.pick[f]||'')});
  var single=cu.n===1&&!extrasOf(c).length;
  if(single&&!R.glass.length&&picks.indexOf(want)>=0){}
  else if(want!==have)bad.push(single?'réponse':'ingrédients');
  extrasOf(c).forEach(function(x){
    if(norm(R.pick[x[0]]||'')!==norm(c[x[0]]))bad.push(x[2]);
  });
  return bad;
}
function serveSeat(i){
  if(R.over)return;
  var cu=R.seats[i];
  if(!cu||cu.served)return;
  if(!hasPrep()){rushFb('<div class="fb"><b>Prépare d’abord ta commande.</b><span>Touche les ingrédients de l’étagère et, si besoin, le verre, la glace ou la méthode. Puis touche le client.</span></div>',3200);return}
  var bad=checkOrder(cu),tok=B.token;
  if(!bad.length){
    R.served++;R.streak++;if(R.streak>R.best)R.best=R.streak;
    var pts=Math.round((10*cu.n+8*cu.ex+Math.round(cu.pat/cu.max*10))*(1+Math.min(R.streak-1,5)*0.2));
    R.score+=pts;
    if(!R.errCards[cu.card.id])bump(cu.card.id,1);
    gain(4);
    rushFb('<div class="fb good"><b>'+esc(cu.name)+' adore ! +'+pts+'</b></div>',1500);
    cu.served=true;
    cu.say={txt:pickTxt(CHAT.ok),kind:'chat',until:R.el+1100};
    renderSeats();
    setTimeout(function(){
      if(tok!==B.token||R.over)return;
      if(R.seats[i]===cu){R.seats[i]=null;R.nextAt[i]=R.el+300;renderSeats()}
    },850);
  }else{
    R.wrong++;R.streak=0;R.errCards[cu.card.id]=cu.card;
    if(!cu.penal){cu.penal=true;bump(cu.card.id,-1)}
    cu.pat-=6000;
    bubble(i,pickTxt(CHAT.wrong),'chat',2600,true);
    rushFb('<div class="fb bad"><b>Pas tout à fait. À corriger : '+bad.join(', ')+'.</b><span>'+esc(cu.card.q)+' demande :</span>'+recipeHTML(cu.card)+'</div>',4600);
  }
  R.glass=[];R.pick={};
  updGlass();updX();updRush();
}
function endRush(){
  if(R.over)return;
  R.over=true;clearInterval(R.iv);
  var tries=R.served+R.wrong+R.missed,acc=tries?Math.round(R.served/tries*100):0;
  var stars=(R.served>=8&&R.wrong+R.missed<=2)?3:R.served>=5?2:1;
  var review=Object.keys(R.errCards).map(function(k){return R.errCards[k]});
  finish('Service terminé !',stars,['Boissons servies : '+R.served,'Précision : '+acc+' %','Meilleure série : '+R.best,'Score '+R.score],review);
}

/* ---------- affichage + événements ---------- */
function render(){
  var h=header();
  if(view==='home')h+=homeHTML();
  else if(view==='edit')h+=editHTML();
  else if(G){
    if(G.intro)h+=introHTML(G.type);
    else if(G.type==='match')h+=matchHTML();
    else if(G.type==='quiz')h+=quizHTML();
    else if(G.type==='flip')h+=flipHTML();
    else if(G.type==='crush')h+=crushHTML();
    else if(G.type==='rush')h+=rushHTML();
    else h+=typeHTML();
  }
  $app.innerHTML=h;
}
function go(v){B.token++;view=v;if(v!=='game')G=null;render();window.scrollTo(0,0)}
function beginGame(type){
  if(type==='crush')initBoard();
  else if(type==='rush')initRush();
  else if(type==='type')focusType();
}
function play(type,skip){
  if(S.cards.length<3)return;
  B.token++;
  if(type==='match')startMatch();else if(type==='quiz')startQuiz();else if(type==='flip')startFlip();else if(type==='crush')startCrush();else if(type==='rush')startRush();else startType();
  G.intro=!skip;
  if(skip&&type==='rush')G.phase='run';
  view='game';render();window.scrollTo(0,0);
  if(skip)beginGame(type);
}
function tidy(){
  S.cards.forEach(function(c){c.q=c.q.trim();c.a=c.a.trim();['glass','ice','method'].forEach(function(f){c[f]=(c[f]||'').trim()})});
  S.cards=S.cards.filter(function(c){return c.q&&c.a});
  save();
}
var PASTE=/^(.*?)(?:\s*=\s*|\t+|\s+[-–—]\s+)(.+)$/;

$app.addEventListener('click',function(e){
  var cd=e.target.closest('.candy');
  if(cd){if(e.detail===0&&cd.__t)tapSelect(cd.__t);return}
  var b=e.target.closest('[data-act]');
  if(!b||!$app.contains(b))return;
  var act=b.dataset.act;
  switch(act){
    case 'home':if(view==='edit')tidy();go('home');break;
    case 'edit':go('edit');break;
    case 'play-match':play('match');break;
    case 'play-quiz':play('quiz');break;
    case 'play-flip':play('flip');break;
    case 'play-type':play('type');break;
    case 'play-crush':play('crush');break;
    case 'play-rush':play('rush');break;
    case 'startgame':
      B.token++;G.intro=false;
      if(G.type==='rush')G.phase='run';
      render();window.scrollTo(0,0);beginGame(G.type);
      break;
    case 'diff':S.diff=b.dataset.d;save();render();break;
    case 'replay':play(G.type,true);break;
    case 'cnext':nextCrush();break;
    case 'cretry':L=buildLevel(G.queue[G.li]);G.phase='play';B.token++;render();initBoard();break;
    case 'peek':
      if(L&&!L.over){
        L.peeked=true;
        var pb=document.getElementById('peekBox');
        pb.innerHTML='<div class="peek">'+ansHTML(L.card.a)+'</div>';
        clearTimeout(B.peekT);B.peekT=setTimeout(function(){pb.innerHTML=''},4000);
      }
      break;
    case 'add':
      if(R&&!R.over){var ai=+b.dataset.i;if(R.glass.indexOf(ai)<0&&R.glass.length<6){R.glass.push(ai);updGlass(true)}}
      break;
    case 'unadd':
      if(R&&!R.over){R.glass=R.glass.filter(function(k){return k!==+b.dataset.i});updGlass()}
      break;
    case 'dump':if(R&&!R.over){R.glass=[];R.pick={};updGlass();updX()}break;
    case 'seat':serveSeat(+b.dataset.i);break;
    case 'xpick':
      if(R&&!R.over){var xf=b.dataset.f,xv=R.xopts[xf][+b.dataset.i];R.pick[xf]=(R.pick[xf]===xv?null:xv);updX();updGlass()}
      break;
    case 'tile':tapTile(+b.dataset.i);break;
    case 'opt':answerQuiz(+b.dataset.i);break;
    case 'next':if(G.type==='quiz')nextQuiz();else nextType();break;
    case 'flip':if(!G.flipped){G.flipped=true;render()}break;
    case 'know':
      var kc=G.queue[G.i];bump(kc.id,1);gain(4);G.known++;nextFlip();break;
    case 'again':
      var ac=G.queue[G.i];bump(ac.id,-1);G.again++;
      G.tries[ac.id]=(G.tries[ac.id]||0)+1;
      if(G.tries[ac.id]<=2)G.queue.push(ac);else G.known++;
      nextFlip();break;
    case 'addrow':
      S.cards.push({id:uid(),q:'',a:'',m:0});S.sample=false;save();render();
      var last=S.cards[S.cards.length-1],inp=document.getElementById('q-'+last.id);
      if(inp)inp.focus();
      break;
    case 'delrow':
      S.cards=S.cards.filter(function(c){return c.id!==b.dataset.id});S.sample=false;save();render();break;
    case 'loadsample':
      defaults().cards.forEach(function(c){S.cards.push(c)});S.sample=false;save();render();window.scrollTo(0,0);break;
    case 'pasteadd':
      var ta=document.getElementById('pasteIn'),added=0,skipped=0;
      ta.value.split(/\r?\n/).forEach(function(line){
        line=line.trim();if(!line)return;
        var m=PASTE.exec(line);
        if(m&&m[1].trim()&&m[2].trim()){S.cards.push({id:uid(),q:m[1].trim(),a:m[2].trim(),m:0});added++}
        else skipped++;
      });
      if(added){S.sample=false;save();render();
        var d=document.getElementById('pasteBox');d.open=true;
        document.getElementById('pasteMsg').textContent=pl(added,'carte ajoutée','cartes ajoutées')+(skipped?'. '+pl(skipped,'ligne ignorée','lignes ignorées')+' (pas de signe =).':'.');
      }else{
        document.getElementById('pasteMsg').textContent=skipped?'Rien n’a été ajouté. Chaque ligne doit avoir un signe = entre le nom et la réponse.':'Colle d’abord ta liste.';
      }
      break;
    case 'clearall':
      if(!clearArm){
        clearArm=true;b.textContent='Touche encore pour tout supprimer';
        clearTimer=setTimeout(function(){clearArm=false;var cb=document.getElementById('clearBtn');if(cb)cb.textContent='Tout supprimer'},3000);
      }else{
        clearArm=false;clearTimeout(clearTimer);
        S.cards=[];S.sample=false;save();render();
      }
      break;
  }
});
$app.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f){
    var c=S.cards.find(function(x){return x.id===t.dataset.id});
    if(c){c[t.dataset.f]=t.value;S.sample=false;save()}
  }
});
$app.addEventListener('toggle',function(e){
  if(e.target.id==='howto'){S.intro=e.target.open;save()}
},true);
$app.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id!=='typeForm'||!G||G.type!=='type'||G.answered)return;
  var v=document.getElementById('typeIn').value,c=G.queue[G.i],r=judge(v,c.a);
  G.input=v;G.answered=true;G.verdict=r;
  if(r.ok){G.correct++;bump(c.id,1);gain(6)}else bump(c.id,-1);
  render();
});

render();
})();
</script>
